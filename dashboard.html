<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzen – Leerpret</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1e2a78">
<link rel="stylesheet" href="/css/leerpret.css">
<style>
  main{padding:34px 0 60px}
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
  .top h1{font-size:clamp(1.8rem,3vw,2.6rem);margin:0}
  .top .school{color:var(--muted);font-weight:700}
  /* klaskeuze */
  .klasbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:26px}
  .klasbar .lbl{font-family:var(--head);font-weight:800;color:var(--navy);font-size:1.15rem;margin-right:4px}
  .klasbar button{font-family:var(--head);font-weight:800;font-size:1.1rem;padding:.5em 1.2em;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;transition:all .15s}
  .klasbar button:hover{border-color:var(--sky)}
  .klasbar button.active{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 4px 0 #c95d10}
  .klasbar button small{font-weight:700;opacity:.7;font-size:.8em;margin-left:.4em}
  .klasbar .edit{margin-left:auto;font-size:.95rem;font-weight:700;color:var(--muted);text-decoration:none}
  .klasbar .edit:hover{color:var(--navy)}
  /* filters */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
  .filters button{font-family:var(--head);font-weight:700;font-size:.95rem;padding:.4em 1em;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
  .filters button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .filters .count{margin-left:auto;color:var(--muted);font-weight:700;font-size:.95rem}
  /* quizkaarten – groot, leesbaar op het digibord */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .qcard{position:relative;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;transition:transform .15s,border-color .15s;min-height:210px}
  .qcard:hover{transform:translateY(-3px);border-color:var(--sky)}
  .qcard.dim{opacity:.55}
  .qcard .head{display:flex;gap:14px;align-items:center}
  .qcard .ico{width:64px;height:64px;border-radius:18px;background:#eef1ff;display:flex;align-items:center;justify-content:center;font-size:2.1rem;flex:none}
  .qcard h3{margin:0;font-size:1.4rem;line-height:1.15}
  .qcard .m{color:var(--muted);font-weight:700;font-size:.95rem}
  .qcard .tags{display:flex;flex-wrap:wrap;gap:6px}
  .qcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
  .qcard .btn{font-size:1.1rem}
  .badge-new{position:absolute;top:-10px;right:16px;background:var(--pink);color:#fff;font-family:var(--head);font-weight:800;font-size:.85rem;padding:.2em .8em;border-radius:999px;box-shadow:0 3px 0 #b3235f}
  .empty{color:var(--muted);padding:40px;text-align:center;border:2px dashed var(--line);border-radius:var(--radius);background:#fff}
  .empty a{font-weight:700}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="44" height="44"><span class="word">Leer<b>pret</b></span></a>
    <nav class="nav"><a href="/dashboard.html">Quizzen</a><a href="/klassen.html">Mijn klassen</a><a href="/admin.html" id="adminLink" hidden>Beheer</a><a class="cta" href="#" id="logout">Uitloggen</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="top">
    <div><h1 id="hello">Dag!</h1><div class="school" id="school"></div></div>
    <a class="btn btn-light btn-sm" href="/quiz.html?demo=1" target="_blank">Demo-quiz bekijken</a>
  </div>
  <div id="msg"></div>

  <div class="klasbar" id="klasbar" hidden>
    <span class="lbl">Wie speelt mee?</span>
    <span id="klasbtns"></span>
    <a class="edit" href="/klassen.html">✏️ Klassen &amp; namenlijsten beheren</a>
  </div>

  <div class="filters" id="filters" hidden>
    <button class="active" data-f="all">Alle quizzen</button>
    <button data-f="fit">Voor deze klas</button>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="quizzes"></div>
</main>

<footer class="site-footer"><div class="wrap"><small>© <span id="year"></span> Leerpret</small><div><a href="/privacy.html">Privacy</a><a href="/">Home</a></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const $=id=>document.getElementById(id), esc=LP.esc;
let profile=null, classes=[], quizzes=[], activeClass=null, filter='all';
function note(t,cls){$('msg').innerHTML=t?`<div class="notice ${cls}">${t}</div>`:'';}
const ord=n=>n===1?'1ste':n+'de';
$('logout').addEventListener('click',async e=>{e.preventDefault();await LP.sb.auth.signOut();location.href='/';});

async function init(){
  const user=await LP.requireAuth(); if(!user) return;
  profile=await LP.myProfile();
  $('hello').textContent=`Dag ${(profile&&profile.full_name)||LP.toUsername(user.email)}! 👋`;
  if(profile&&profile.role==='admin') $('adminLink').hidden=false;
  if(!profile||!profile.school_id){ $('school').textContent='Je account is nog niet aan een school gekoppeld. Mail naar info@leerpret.be.'; return; }
  $('school').textContent=profile.schools?profile.schools.name:'';
  const [c,q]=await Promise.all([
    LP.sb.from('classes').select('id,name,grade,pupils').eq('school_id',profile.school_id).order('grade').order('name'),
    LP.sb.from('quizzes').select('id,title,theme,emoji,grade_min,grade_max,school_id,questions,created_at').eq('published',true).order('created_at',{ascending:false})
  ]);
  if(c.error||q.error){note('Laden mislukt: '+esc((c.error||q.error).message),'err');return;}
  classes=c.data||[]; quizzes=q.data||[];
  try{ const last=localStorage.getItem('lp_class'); if(last&&classes.find(x=>x.id===last)) activeClass=last; }catch(e){}
  if(!activeClass&&classes.length) activeClass=classes[0].id;
  renderKlassen(); renderQuizzes();
}
function renderKlassen(){
  const bar=$('klasbar'); bar.hidden=false;
  if(!classes.length){ $('klasbtns').innerHTML='<span class="muted" style="font-weight:700">Nog geen klas – <a href="/klassen.html">maak er eerst één aan</a>.</span>'; return; }
  $('klasbtns').innerHTML=classes.map(c=>`<button data-id="${c.id}" class="${c.id===activeClass?'active':''}">${esc(c.name)}<small>${(c.pupils||[]).length} 👦👧</small></button>`).join(' ');
}
$('klasbtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;activeClass=b.dataset.id;try{localStorage.setItem('lp_class',activeClass)}catch(x){}renderKlassen();renderQuizzes();});
$('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));renderQuizzes();});

function renderQuizzes(){
  const box=$('quizzes'); const c=classes.find(x=>x.id===activeClass);
  $('filters').hidden=!c;
  if(!quizzes.length){box.innerHTML='<div class="empty">Er zijn nog geen quizzen beschikbaar.</div>';return;}
  const fits=q=>c&&c.grade>=q.grade_min&&c.grade<=q.grade_max;
  const list=quizzes.filter(q=>filter==='all'||fits(q));  // nieuwste eerst (al zo gesorteerd)
  $('count').textContent=`${list.length} ${list.length===1?'quiz':'quizzen'}`;
  if(!list.length){box.innerHTML='<div class="empty">Geen quizzen die precies bij dit leerjaar passen. Kies "Alle quizzen".</div>';return;}
  const fresh=Date.now()-14*864e5;
  box.innerHTML=list.map(q=>{
    const n=Array.isArray(q.questions)?q.questions.length:0, fit=fits(q), isNew=q.created_at&&new Date(q.created_at).getTime()>fresh;
    const lj=q.grade_min===q.grade_max?`${ord(q.grade_min)} leerjaar`:`${ord(q.grade_min)} – ${ord(q.grade_max)} leerjaar`;
    return `<article class="qcard ${c&&!fit?'dim':''}">
      ${isNew?'<span class="badge-new">Nieuw!</span>':''}
      <div class="head"><div class="ico">${esc(q.emoji||'🎯')}</div><div><h3>${esc(q.title)}</h3><div class="m">${esc(q.theme||'')}${q.theme?' · ':''}${n} vragen</div></div></div>
      <div class="tags"><span class="tag">${lj}</span>${q.school_id?'<span class="tag orange">eigen quiz</span>':''}${fit?'<span class="tag green">past bij deze klas</span>':''}</div>
      <div class="foot"><span class="m">${c?'Speelt met klas '+esc(c.name):''}</span>
        <a class="btn btn-primary" ${c?`href="/quiz.html?quiz=${q.id}&class=${c.id}" target="_blank"`:'href="/klassen.html" title="Maak eerst een klas aan"'}>▶ Start</a></div>
    </article>`;}).join('');
}
init();
</script>
</body>
</html>
